# Len na forku once94/PineTS: testy a zostavenie balíka pre opravu ta.vwap.
# Nie je súčasťou PR do LuxAlgo/PineTS.
name: ci-vwap
on:
  push:
    branches: [ci/vwap-tests, ci/baseline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Nový test VWAP (na baseline chýba, preskočí)
        run: test -f tests/namespaces/ta/vwap-trading-day.test.ts && npx vitest run tests/namespaces/ta/vwap-trading-day.test.ts || true
      - name: Všetky testy
        run: npm test -- --run --reporter=json --outputFile=vysledky.json || true
      - name: Zostavenie a balík
        run: |
          npm run build:prod:all
          npm pack
          sha256sum pinets-*.tgz | tee pinets.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pinets-vwapfix
          path: |
            pinets-*.tgz
            pinets.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vysledky-testov
          path: vysledky.json
